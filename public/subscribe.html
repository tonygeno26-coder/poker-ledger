<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subscribe — Pocketbooks Poker</title>
  <style>
    :root {
      --bg: #0a0a0b;
      --surface: #141416;
      --border: #2a2a2e;
      --text: #f5f5f5;
      --muted: #9a9aa0;
      --red: #e03131;
      --red-dim: rgba(224, 49, 49, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(224, 49, 49, 0.22), transparent 55%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
    }
    h1 { font-size: 1.4rem; font-weight: 900; margin: 0 0 8px; letter-spacing: -0.02em; }
    p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin: 0 0 18px; }
    label {
      display: block; text-align: left; font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
    }
    input {
      width: 100%; height: 48px; border-radius: 10px; border: 1px solid var(--border);
      background: #0f0f11; color: var(--text); padding: 0 14px; font-size: 16px; margin-bottom: 12px;
    }
    input:focus { outline: none; border-color: var(--red); }
    .btn {
      width: 100%; height: 52px; border: none; border-radius: 12px;
      background: var(--red); color: #fff; font-size: 16px; font-weight: 800; cursor: pointer;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg {
      display: none; margin-top: 12px; padding: 12px; border-radius: 10px;
      font-size: 14px; font-weight: 600; line-height: 1.4;
    }
    .msg.show { display: block; }
    .msg.ok { background: rgba(16,185,129,0.12); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .msg.err { background: var(--red-dim); color: #ff8787; border: 1px solid rgba(224,49,49,0.35); }
    .status { font-size: 13px; color: var(--muted); margin-bottom: 14px; min-height: 1.2em; }
    a { color: var(--red); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Subscribe to Pocketbooks</h1>
    <p>$19.99/month — unlock the full poker ledger after your trial.</p>
    <div class="status" id="status">Preparing…</div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
    <button class="btn" id="pay-btn" type="button" onclick="startCheckout()">Continue to Stripe</button>
    <div class="msg" id="msg"></div>
    <p style="margin-top:18px;margin-bottom:0;font-size:13px"><a href="/">← Back</a></p>
  </div>

  <script>
    function showMsg(text, ok) {
      var el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg show ' + (ok ? 'ok' : 'err');
    }

    function qs(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function hashParams() {
      var h = (window.location.hash || '').replace(/^#/, '');
      return new URLSearchParams(h);
    }

    async function verifyFromLink() {
      var status = document.getElementById('status');
      var hp = hashParams();
      var access = hp.get('access_token') || qs('access_token');
      var tokenHash = qs('token_hash') || qs('token');
      var type = qs('type') || 'email';

      if (!access && !tokenHash) {
        status.textContent = 'Confirm your email, then continue to checkout.';
        return;
      }

      status.textContent = 'Verifying magic link…';
      try {
        var body = access
          ? { access_token: access }
          : { token_hash: tokenHash, token: tokenHash, type: type };
        var res = await fetch('/auth/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        var data = await res.json().catch(function(){ return {}; });
        if (!res.ok) throw new Error(data.error || 'Verify failed');
        if (data.user && data.user.email) {
          document.getElementById('email').value = data.user.email;
          try { localStorage.setItem('pb_sub_email', data.user.email); } catch (e) {}
        }
        if (data.isActive && data.subscription_status === 'active') {
          status.textContent = 'Subscription active. You\'re all set.';
          showMsg('You already have an active subscription.', true);
          return;
        }
        status.textContent = 'Verified. Continue to Stripe to subscribe.';
        // Auto-start checkout after magic-link verify
        startCheckout();
      } catch (err) {
        status.textContent = 'Could not verify link — enter email to continue.';
        showMsg(err.message || 'Verify failed', false);
      }
    }

    async function startCheckout() {
      var email = (document.getElementById('email').value || '').trim();
      var btn = document.getElementById('pay-btn');
      if (!email || email.indexOf('@') < 0) {
        showMsg('Enter a valid email', false);
        return;
      }
      btn.disabled = true;
      document.getElementById('status').textContent = 'Opening Stripe Checkout…';
      try {
        try { localStorage.setItem('pb_sub_email', email); } catch (e) {}
        var res = await fetch('/subscription/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });
        var data = await res.json().catch(function(){ return {}; });
        if (!res.ok || !data.checkoutUrl) throw new Error(data.error || 'Checkout failed');
        window.location.href = data.checkoutUrl;
      } catch (err) {
        showMsg(err.message || 'Checkout failed', false);
        document.getElementById('status').textContent = 'Checkout failed — try again.';
        btn.disabled = false;
      }
    }

    (function init() {
      var checkout = qs('checkout');
      if (checkout === 'success') {
        document.getElementById('status').textContent = 'Payment received — activating your subscription.';
        showMsg('Thanks! Access updates after Stripe webhook confirmation (usually seconds).', true);
      } else if (checkout === 'cancel') {
        document.getElementById('status').textContent = 'Checkout canceled.';
        showMsg('No charge was made. You can try again anytime.', false);
      }

      try {
        var saved = localStorage.getItem('pb_sub_email');
        if (saved) document.getElementById('email').value = saved;
      } catch (e) {}

      verifyFromLink();
    })();
  </script>
</body>
</html>
